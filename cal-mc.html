      { days:3,    take:{desayuno:1,   cena:1}   },
      { days:3,    take:{desayuno:1,   cena:0.5} },
      { days:3,    take:{desayuno:0.5, cena:0.5} },
      { days:null, take:{desayuno:0.5}           }, // dosis habitual 5 mg: mantener
    ];

    // from/to = día del tratamiento (1 = 28/11/2026). Sin `to` = indefinido.
    const MEDS = [
      { id:"ferplex",       name:"Ferplex (hierro oral)",      unit:"vial",       isNew:true, to:90,          take:{ayunas:1} },
      { id:"omeprazol",     name:"Omeprazol 20 mg",            unit:"comprimido", isNew:true,                 take:{predesayuno:1} },
      { id:"moxifloxacino", name:"Moxifloxacino 400 mg",       unit:"comprimido", isNew:true, to:5,           take:{desayuno:1}, tag:"Antibiótico" },
      { id:"prednisona",    name:"Prednisona 10 mg",           unit:"comprimido", isNew:true, steps:PRED_STEPS, tag:"Dosis en bajada: ¡ojo a los cambios!" },
      { id:"furosemida",    name:"Furosemida 40 mg",           unit:"comprimido", isNew:true, to:5,           take:{desayuno:0.5} },
      { id:"paracetamol",   name:"Paracetamol 1 g",            unit:"comprimido", isNew:true,                 take:{desayuno:1,comida:1,cena:1} },
      { id:"acfol",         name:"Acfol (ácido fólico) 5 mg",  unit:"comprimido", isNew:true, to:LAST_DAY_6M, take:{desayuno:1} },
      { id:"paroxetina",    name:"Paroxetina 10 mg",           unit:"comprimido",                             take:{desayuno:0.5} },
      { id:"levogastrol",   name:"Levogastrol 25 mg",          unit:"comprimido",                             take:{desayuno:1} },
      { id:"tebofortan",    name:"Tebofortán 240 mg",          unit:"comprimido",                             take:{desayuno:1} },
      { id:"zimbus",        name:"Zimbus Breezhaler",          unit:"inhalación",                             take:{desayuno:1}, tag:"Inhalador" },
      { id:"yellox",        name:"Yellox 0,9 mg/ml colirio",   unit:"colirio",                                take:{desayuno:1,cena:1}, doseText:"Colirio" },
      { id:"demilos",       name:"Demilos 600 mg/2000 UI",     unit:"comprimido", isNew:true,                 take:{comida:1} },
      { id:"adiro",         name:"Adiro 100 mg",               unit:"comprimido",                             take:{comida:1} },
      { id:"atorvastatina", name:"Atorvastatina 40 mg",        unit:"comprimido",                             take:{cena:1} },
      { id:"tamsulosina",   name:"Tamsulosina 0,4 mg",         unit:"cápsula",    isNew:true,                 take:{cena:1} },
      { id:"enoxaparina",   name:"Enoxaparina 40 mg",          unit:"inyección",  isNew:true, to:30,          take:{inyeccion:1}, note:"Bajo la piel. Alternar el sitio y evitar la línea media del abdomen." },
      { id:"aduben",        name:"Aduben Advance fibra",       unit:"envase",     isNew:true, to:LAST_DAY_3M, take:{dia:2}, split:true, tag:"Suplemento nutricional" },
    ];

    // Solo si hace falta
    const PRN = [
      { id:"tramadol", name:"Tramadol 50 mg", dose:"1 comprimido",          rule:"Solo si hay más dolor a pesar del paracetamol. Como mucho cada 12 horas.", minHours:12 },
      { id:"movicol",  name:"Movicol 10 g",   dose:"1 sobre en el desayuno", rule:"Solo si hay estreñimiento." },
    ];

    // Cada cierto tiempo
    const PERIODIC = [
      { id:"metoject",  name:"Metoject pen 15 mg", dose:"1 vez a la semana",                 everyDays:7 },
      { id:"denosumab", name:"Denosumab 60 mg",    dose:"Inyección bajo la piel cada 6 meses", everyMonths:6, firstPending:"Al alta quedó PENDIENTE la 1ª dosis." },
    ];

    // Retirados en el alta: NO dar
    const RETIRED = [
      { name:"Actonel (ácido risedrónico)" },
    ];

    const REMINDERS = [
      "Retirar la sonda vesical a los 7 días en el centro de salud (hacia el 4/12).",
      "Retirada de grapas por enfermería del centro de salud a las 3 semanas de la cirugía (operada el 19/11, hacia el 10/12), si la herida ha cicatrizado.",
      "Revisión en Consultas Externas de Traumatología (planta -1) en 3 semanas, con radiografía de control.",
      "Frío local 10-15 minutos cada 3-4 horas.",
      "Mantener la herida limpia y seca.",
      "Andar con ayuda de andador o muletas. Traslados en ambulancia.",
      "Control del dolor: médico de atención primaria.",
    ];

    const PLURAL = { comprimido:"comprimidos", "cápsula":"cápsulas", vial:"viales", envase:"envases", "inyección":"inyecciones", "inhalación":"inhalaciones", sobre:"sobres" };

    function fmtQty(q, unit) {
      const whole = Math.floor(q), half = q - whole === 0.5;
      if (whole===0 && half) return `½ ${unit}`;
      const n = half ? `${whole} y ½` : String(whole);
      return `${n} ${q>1 ? (PLURAL[unit]||unit) : unit}`;
    }

    function doseLabel(med, q) {
      if (med.doseText) return med.doseText;
      return fmtQty(q, med.unit);
    }

    function takeOn(med, d) {
      if (d < 1) return {};
      if (med.steps) {
        let start = 1;
        for (const s of med.steps) {
          if (s.days===null || d < start+s.days) return s.take;
          start += s.days;
        }
        return {};
      }
      if (d < (med.from||1) || (med.to && d > med.to)) return {};
      return med.take;
    }

    function describeTake(med, take) {
      return MOMENTS.filter(m=>take[m.id]).map(m => `${doseLabel(med,take[m.id])} ${m.id==="dia"?"al día":m.id==="inyeccion"?"al día":"en "+m.short}`).join(" + ");
    }

    function changesAfter(fromDay, span) {
      const out = [];
      for (let k=Math.max(fromDay,1)+1; k<=fromDay+span; k++) {
        const msgs = [];
        for (const med of MEDS) {
          const a = takeOn(med,k-1), b = takeOn(med,k);
          if (JSON.stringify(a)===JSON.stringify(b)) continue;
          if (!Object.keys(b).length)      msgs.push({kind:"stop",   text:`Se deja ${med.name}`});
          else if (!Object.keys(a).length) msgs.push({kind:"start",  text:`Empieza ${med.name}: ${describeTake(med,b)}`});
          else                             msgs.push({kind:"change", text:`${med.name}: pasa a ${describeTake(med,b)}`});
        }
        if (msgs.length) out.push({day:k, date:dateOfDay(k), msgs});
      }
      return out;
    }

    function MedsView({ meds, updateMeds }) {
      const realToday = new Date(); realToday.setHours(0,0,0,0);
      const [sel, setSel] = useState(() => realToday < MED_START ? MED_START : realToday);
      const [who, setWho] = useState(() => { try { return localStorage.getItem("calmc-who") || ""; } catch { return ""; } });
      const [showAll, setShowAll] = useState(false);
      const [, setTick] = useState(0);

      // refresca cada minuto para que los avisos "FALTA" se actualicen
      useEffect(() => { const t=setInterval(()=>setTick(x=>x+1), 60000); return ()=>clearInterval(t); }, []);

      function pickWho(n) { setWho(n); try { localStorage.setItem("calmc-who", n); } catch {} }

      const d        = dayNum(sel);
      const key      = toKey(sel);
      const checks   = (meds.checks||{})[key] || {};
      const log      = meds.log || [];
      const isToday  = isSameDay(sel, realToday);
      const isFuture = sel > realToday;
      const isPast   = sel < realToday;
      const nowH     = new Date().getHours();

      const groups = MOMENTS.map(m => {
        const items = [];
        for (const med of MEDS) {
          const q = takeOn(med,d)[m.id];
          if (!q) continue;
          const prev = takeOn(med,d-1)[m.id] || 0;
          const nextAll = takeOn(med,d+1);
          const next = nextAll[m.id] || 0;
          const badges = [];
          if (med.isNew && d<=3)            badges.push({t:"NUEVA", c:"#1A8A6A"});
          if (d>1 && prev && prev!==q)      badges.push({t:"⚠️ CAMBIA LA DOSIS HOY", c:"#C0392B"});
          if (!Object.keys(nextAll).length) badges.push({t:"ÚLTIMO DÍA", c:"#C47000"});
          else if (!next)                   badges.push({t:"MAÑANA YA NO", c:"#C47000"});
          else if (next!==q)                badges.push({t:`MAÑANA: ${doseLabel(med,next)}`, c:"#C47000"});
          const parts = med.split ? Array.from({length:q},(_,i)=>i+1) : [null];
          for (const p of parts) {
            items.push({
              itemId: `${m.id}:${med.id}${p?":"+p:""}`,
              med, badges,
              dose: med.split ? `${fmtQty(1,med.unit)} (${p}º de ${q})` : doseLabel(med,q),
            });
          }
        }
        const done = items.filter(it=>checks[it.itemId]).length;
        const late = items.length>0 && done<items.length && (isPast || (isToday && nowH>=m.end));
        return {...m, items, done, late};
      }).filter(g=>g.items.length);

      const total = groups.reduce((s,g)=>s+g.items.length,0);
      const done  = groups.reduce((s,g)=>s+g.done,0);

      function needWho() {
        if (who) return false;
        alert("Primero elige arriba quién eres (Laura o Cristina).");
        return true;
      }

      function toggle(it) {
        if (isFuture) { alert("Ese día todavía no ha llegado."); return; }
        if (needWho()) return;
        const cur = checks[it.itemId];
        if (cur && !confirm(`¿Desmarcar ${it.med.name}?\nLo marcó ${cur.by} a las ${fmtTime(cur.at)}.`)) return;
        const entry = cur ? null : {by:who, at:new Date().toISOString()};
        updateMeds(m => {
          m.checks = m.checks || {};
          const day = m.checks[key] = m.checks[key] || {};
          if (entry) day[it.itemId] = entry; else delete day[it.itemId];
          if (!Object.keys(day).length) delete m.checks[key];
          return m;
        });
      }

      function lastOf(medId) {
        return log.filter(e=>e.med===medId).sort((a,b)=>b.at.localeCompare(a.at))[0];
      }

      function addLog(medId, name, warn) {
        if (needWho()) return;
        if (warn && !confirm(warn)) return;
        if (!warn && !confirm(`¿Apuntar ${name} ahora (${fmtTime(new Date().toISOString())})?`)) return;
        const entry = {id:`${Date.now()}-${Math.random().toString(36).slice(2,7)}`, med:medId, at:new Date().toISOString(), by:who};
        updateMeds(m => { m.log = [...(m.log||[]), entry]; return m; });
      }

      function removeLog(e, name) {
        if (!confirm(`¿Borrar la toma de ${name} del ${fmtDateTime(e.at)} (${e.by})?`)) return;
        updateMeds(m => { m.log = (m.log||[]).filter(x=>x.id!==e.id); return m; });
      }

      const changes = changesAfter(d, 30).slice(0,6);
      const card = {background:"white",borderRadius:18,border:"2px solid #DCDCDC",marginBottom:12,overflow:"hidden",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"};
      const secTitle = {padding:"18px 4px 8px",fontSize:13,fontWeight:900,color:"#999",letterSpacing:3,textTransform:"uppercase",borderBottom:"2px solid #DCDCDC",marginBottom:10};
      const btn = {background:"#6C5CE7",color:"white",border:"none",borderRadius:10,padding:"10px 14px",fontSize:14,fontWeight:800,cursor:"pointer"};

      const dayLabel = isToday ? "HOY" : isSameDay(sel, addDays(realToday,1)) ? "MAÑANA" : isSameDay(sel, addDays(realToday,-1)) ? "AYER" : "";

      return (
        <div style={{padding:"10px 10px 40px"}}>

          {/* ¿Quién marca? */}
          <div style={{...card,padding:"12px 14px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",border:who?"2px solid #DCDCDC":"3px solid #E74C3C"}}>
            <div style={{fontSize:14,fontWeight:800,color:"#555"}}>¿Quién marca?</div>
            {["Laura","Cristina"].map(n=>(
              <button key={n} onClick={()=>pickWho(n)} style={{background:who===n?"#6C5CE7":"white",color:who===n?"white":"#444",border:`2px solid ${who===n?"#6C5CE7":"#DEDEDE"}`,borderRadius:20,padding:"7px 16px",fontSize:15,fontWeight:800,cursor:"pointer"}}>{n}</button>
            ))}
          </div>

          {/* Retirados */}
          <div style={{...card,padding:"12px 14px",background:"#FFF5F5",border:"3px solid #E74C3C"}}>
            <div style={{fontSize:13,fontWeight:900,color:"#C0392B",letterSpacing:1}}>⛔ YA NO SE TOMA (retirado en el alta)</div>
            {RETIRED.map(r=><div key={r.name} style={{fontSize:17,fontWeight:800,color:"#C0392B",marginTop:4}}>{r.name}</div>)}
          </div>

          {/* Navegación por días */}
          <div style={{...card,padding:"10px",display:"flex",alignItems:"center",gap:8}}>
            <button disabled={d<=1} onClick={()=>setSel(addDays(sel,-1))} style={{...btn,opacity:d<=1?0.3:1,fontSize:20,padding:"8px 14px"}}>◀</button>
            <div style={{flex:1,textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:900,color:"#333"}}>{DAY_NAMES[sel.getDay()]} {sel.getDate()}</div>
              <div style={{fontSize:13,fontWeight:700,color:"#888"}}>{MONTH_NAMES[sel.getMonth()].toLowerCase()} · día {d} del tratamiento</div>
              {dayLabel && <div style={{display:"inline-block",marginTop:4,background:"#6C5CE7",color:"white",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:800,letterSpacing:1}}>{dayLabel}</div>}
            </div>
            <button onClick={()=>setSel(addDays(sel,1))} style={{...btn,fontSize:20,padding:"8px 14px"}}>▶</button>
          </div>
          {!isToday && realToday>=MED_START && (
            <div style={{textAlign:"center",marginBottom:10}}>
              <button onClick={()=>setSel(realToday)} style={{...btn,background:"white",color:"#6C5CE7",border:"2px solid #6C5CE7"}}>⭐ Volver a hoy</button>
            </div>
          )}
          {realToday<MED_START && (
            <div style={{...card,padding:"12px 14px",background:"#FFFBF0",border:"2px solid #F39C12",fontSize:14,fontWeight:700,color:"#8A5A00"}}>
              El tratamiento nuevo empieza mañana, {fmtDate(MED_START)}, con el desayuno. Aquí ya puedes ver qué tocará.
            </div>
          )}

          {/* Progreso */}
          <div style={{...card,padding:"12px 14px"}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:15,fontWeight:800,color:"#444",marginBottom:8}}>
              <span>{isFuture ? "Vista previa" : "Tomas marcadas"}</span>
              <span style={{color:done===total?"#1A8A6A":"#6C5CE7"}}>{done} de {total}</span>
            </div>
            <div style={{height:10,background:"#EEE",borderRadius:5,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${total?done/total*100:0}%`,background:done===total?"#27AE80":"#6C5CE7",transition:"width .3s"}}/>
            </div>
          </div>

          {/* Tomas del día */}
          {groups.map(g=>{
            const complete = g.done===g.items.length;
            const head = complete ? {bg:"#27AE80",fg:"white"} : g.late ? {bg:"#E74C3C",fg:"white"} : {bg:"#DCDCDC",fg:"#333"};
            return (
              <div key={g.id} style={{...card,border:`2px solid ${complete?"#27AE80":g.late?"#E74C3C":"#D8D8D8"}`}}>
                <div style={{background:head.bg,color:head.fg,padding:"10px 14px",display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:26}}>{g.emoji}</span>
                  <div style={{flex:1}}>
                    <div style={{fontSize:17,fontWeight:900,letterSpacing:1}}>{g.label}</div>
                    {g.sub && <div style={{fontSize:12,fontWeight:700,opacity:0.85}}>{g.sub}</div>}
                  </div>
                  <div style={{fontSize:13,fontWeight:900,whiteSpace:"nowrap"}}>{complete ? "✓ HECHO" : g.late ? `⚠️ FALTA ${g.items.length-g.done}` : `${g.done}/${g.items.length}`}</div>
                </div>
                {g.items.map(it=>{
                  const c = checks[it.itemId];
                  return (
                    <div key={it.itemId} onClick={()=>toggle(it)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderTop:"1px solid #EEE",cursor:isFuture?"default":"pointer",background:c?"#F0FAF6":"white"}}>
                      <div style={{width:44,height:44,flexShrink:0,borderRadius:12,border:`3px solid ${c?"#27AE80":"#BBB"}`,background:c?"#27AE80":"white",color:"white",fontSize:28,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",opacity:isFuture?0.35:1}}>{c?"✓":""}</div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontSize:17,fontWeight:800,color:"#222",textDecoration:c?"line-through":"none"}}>{it.med.name}</div>
                        <div style={{fontSize:19,fontWeight:900,color:"#6C5CE7"}}>{it.dose}</div>
                        {it.med.tag  && <div style={{fontSize:12,fontWeight:700,color:"#888"}}>{it.med.tag}</div>}
                        {it.med.note && <div style={{fontSize:12,fontWeight:700,color:"#888"}}>{it.med.note}</div>}
                        {it.badges.length>0 && (
                          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:5}}>
                            {it.badges.map(b=><span key={b.t} style={{background:b.c,color:"white",borderRadius:6,padding:"2px 7px",fontSize:11,fontWeight:900,letterSpacing:0.5}}>{b.t}</span>)}
                          </div>
                        )}
                        {c && <div style={{fontSize:12,fontWeight:800,color:"#1A8A6A",marginTop:4}}>✓ {c.by} · {fmtTime(c.at)}</div>}
                      </div>
                    </div>
                  );
                })}
              </div>
            );
          })}

          {/* Solo si hace falta */}
          <div style={secTitle}>Solo si hace falta</div>
          {PRN.map(p=>{
            const last = lastOf(p.id);
            const hours = last ? (Date.now()-new Date(last.at))/3600000 : null;
            const tooSoon = p.minHours && hours!==null && hours < p.minHours;
            const nextAt = tooSoon ? new Date(new Date(last.at).getTime()+p.minHours*3600000).toISOString() : null;
            const recent = log.filter(e=>e.med===p.id).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,3);
            return (
              <div key={p.id} style={{...card,padding:"12px 14px"}}>
                <div style={{fontSize:17,fontWeight:800,color:"#222"}}>{p.name}</div>
                <div style={{fontSize:16,fontWeight:900,color:"#6C5CE7"}}>{p.dose}</div>
                <div style={{fontSize:12,fontWeight:700,color:"#888",marginBottom:8}}>{p.rule}</div>
                {tooSoon && <div style={{background:"#FFF5F5",border:"2px solid #E74C3C",borderRadius:10,padding:"8px 10px",fontSize:14,fontWeight:800,color:"#C0392B",marginBottom:8}}>⛔ Última toma hace {Math.floor(hours)} h. No dar otra hasta las {fmtDateTime(nextAt)}.</div>}
                <button onClick={()=>addLog(p.id, p.name, tooSoon ? `⚠️ Han pasado solo ${Math.floor(hours)} horas desde la última toma de ${p.name} (mínimo ${p.minHours} h).\n¿Seguro que quieres apuntar otra?` : null)} style={{...btn,background:tooSoon?"#BBB":"#6C5CE7"}}>+ Apuntar toma ahora</button>
                {recent.length>0 && (
                  <div style={{marginTop:10,display:"flex",flexDirection:"column",gap:4}}>
                    {recent.map(e=>(
                      <div key={e.id} style={{display:"flex",alignItems:"center",gap:8,fontSize:13,fontWeight:700,color:"#555"}}>
                        <span style={{flex:1}}>✓ {fmtDateTime(e.at)} · {e.by}</span>
                        <button onClick={()=>removeLog(e,p.name)} style={{background:"none",border:"none",color:"#C0392B",fontSize:13,fontWeight:800,cursor:"pointer"}}>Borrar</button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}

          {/* Cada cierto tiempo */}
          <div style={secTitle}>Cada cierto tiempo</div>
          {PERIODIC.map(p=>{
            const last = lastOf(p.id);
            const due = last ? (p.everyDays ? addDays(new Date(last.at),p.everyDays) : addMonths(new Date(last.at),p.everyMonths)) : null;
            if (due) due.setHours(0,0,0,0);
            const overdue = due && due <= realToday;
            return (
              <div key={p.id} style={{...card,padding:"12px 14px",border:(!last&&p.firstPending)||overdue?"3px solid #E74C3C":"2px solid #DCDCDC"}}>
                <div style={{fontSize:17,fontWeight:800,color:"#222"}}>{p.name}</div>
                <div style={{fontSize:16,fontWeight:900,color:"#6C5CE7"}}>{p.dose}</div>
                {!last && p.firstPending && <div style={{fontSize:14,fontWeight:800,color:"#C0392B",margin:"6px 0"}}>⚠️ {p.firstPending}</div>}
                {!last && !p.firstPending && <div style={{fontSize:13,fontWeight:700,color:"#888",margin:"6px 0"}}>Todavía no se ha apuntado ninguna. Márcala el día que se ponga.</div>}
                {last && <div style={{fontSize:13,fontWeight:700,color:"#555",margin:"6px 0"}}>Última: {fmtDateTime(last.at)} ({last.by}) · <b style={{color:overdue?"#C0392B":"#1A8A6A"}}>{overdue?"⚠️ TOCA YA":"Próxima"}: {fmtDate(due)}{p.everyMonths?`/${due.getFullYear()}`:""}</b></div>}
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <button onClick={()=>addLog(p.id, p.name, null)} style={btn}>+ Apuntar puesta hoy</button>
                  {last && <button onClick={()=>removeLog(last,p.name)} style={{background:"none",border:"none",color:"#C0392B",fontSize:13,fontWeight:800,cursor:"pointer"}}>Borrar última</button>}
                </div>
              </div>
            );
          })}

          {/* Próximos cambios */}
          <div style={secTitle}>Próximos cambios</div>
          <div style={{...card,padding:"6px 14px"}}>
            {changes.length===0 && <div style={{padding:"8px 0",fontSize:14,fontWeight:700,color:"#888"}}>Sin cambios en los próximos 30 días.</div>}
            {changes.map(ch=>(
              <div key={ch.day} style={{padding:"10px 0",borderBottom:"1px solid #EEE"}}>
                <div style={{fontSize:14,fontWeight:900,color:"#333"}}>{DAY_NAMES[ch.date.getDay()].charAt(0)+DAY_NAMES[ch.date.getDay()].slice(1).toLowerCase()} {fmtDate(ch.date)}</div>
                {ch.msgs.map((m,i)=>(
                  <div key={i} style={{fontSize:14,fontWeight:700,color:m.kind==="stop"?"#C47000":m.kind==="change"?"#C0392B":"#1A8A6A",marginTop:3}}>
                    {m.kind==="stop"?"⏹️":m.kind==="change"?"🔄":"▶️"} {m.text}
                  </div>
                ))}
              </div>
            ))}
          </div>

          {/* Lista completa */}
          <button onClick={()=>setShowAll(s=>!s)} style={{...btn,width:"100%",background:"white",color:"#6C5CE7",border:"2px solid #6C5CE7",marginTop:6,marginBottom:12}}>
            {showAll ? "▲ Ocultar lista completa" : "📋 Ver lista completa de la medicación"}
          </button>
          {showAll && (
            <div style={{...card,padding:"6px 14px"}}>
              {MEDS.map(med=>(
                <div key={med.id} style={{padding:"10px 0",borderBottom:"1px solid #EEE"}}>
                  <div style={{fontSize:15,fontWeight:800,color:"#222"}}>{med.name}</div>
                  {med.steps ? (
                    med.steps.reduce((acc,s)=>{
                      const from=acc.start, to=s.days===null?null:acc.start+s.days-1;
                      acc.rows.push(<div key={from} style={{fontSize:13,fontWeight:700,color:"#555"}}>{to?`${fmtDate(dateOfDay(from))} al ${fmtDate(dateOfDay(to))}`:`Desde el ${fmtDate(dateOfDay(from))}, mantener`}: {describeTake(med,s.take)}</div>);
                      acc.start = to ? to+1 : acc.start;
                      return acc;
                    },{start:1,rows:[]}).rows
                  ) : (
                    <div style={{fontSize:13,fontWeight:700,color:"#555"}}>
                      {describeTake(med,med.take)} · {med.to ? `del ${fmtDate(dateOfDay(med.from||1))} al ${fmtDate(dateOfDay(med.to))}/${dateOfDay(med.to).getFullYear()}` : (med.isNew ? "de forma indefinida" : "tratamiento habitual")}
                    </div>
                  )}
                </div>
              ))}
              {PRN.map(p=><div key={p.id} style={{padding:"10px 0",borderBottom:"1px solid #EEE"}}><div style={{fontSize:15,fontWeight:800,color:"#222"}}>{p.name}</div><div style={{fontSize:13,fontWeight:700,color:"#555"}}>{p.dose}. {p.rule}</div></div>)}
              {RETIRED.map(r=><div key={r.name} style={{padding:"10px 0",borderBottom:"1px solid #EEE"}}><div style={{fontSize:15,fontWeight:800,color:"#C0392B"}}>⛔ {r.name}</div><div style={{fontSize:13,fontWeight:700,color:"#555"}}>Retirado. No tomar.</div></div>)}
              {PERIODIC.map(p=><div key={p.id} style={{padding:"10px 0",borderBottom:"1px solid #EEE"}}><div style={{fontSize:15,fontWeight:800,color:"#222"}}>{p.name}</div><div style={{fontSize:13,fontWeight:700,color:"#555"}}>{p.dose}. {p.firstPending||""}</div></div>)}
            </div>
          )}

          {/* Recomendaciones */}
          <div style={secTitle}>Otras recomendaciones del alta</div>
          <div style={{...card,padding:"6px 14px"}}>
            {REMINDERS.map((r,i)=><div key={i} style={{padding:"8px 0",borderBottom:i<REMINDERS.length-1?"1px solid #EEE":"none",fontSize:14,fontWeight:700,color:"#444"}}>• {r}</div>)}
          </div>

          <div style={{fontSize:12,color:"#999",fontWeight:600,textAlign:"center",padding:"10px 10px 0",lineHeight:1.5}}>
            Copiado del informe de alta del 27/11/2026. Ante cualquier duda, manda el informe en papel o lo que diga el médico.
          </div>
        </div>
      );
    }

    function App() {
      const [mode, setMode]       = useState("view");
      const [events, setEvents]   = useState({});
      const [editKey, setEditKey] = useState(null);
      const [editIdx, setEditIdx] = useState(null);
      const [form, setForm]       = useState({time:"12:00",text:"",category:"medico"});
      const [status, setStatus]   = useState("loading");
      const [saving, setSaving]   = useState(false);
      const [showPast, setShowPast] = useState(false);
      const [meds, setMeds]       = useState({checks:{},log:[]});
      const [saveError, setSaveError] = useState(false);
      const [tab, setTab]         = useState(() => location.hash==="#medicacion" ? "meds" : "cal");
      const todayRef              = useRef(null);
      const isView                = mode === "view";
      const days                  = buildDays();
      const today                 = days[0];

      const fetchEvents = useCallback(async () => {
        setStatus("loading");
        try {
          const r    = await fetch(`${BIN_URL}/latest`, {headers:{"X-Master-Key":API_KEY}});
          const json = await r.json();
          setEvents(json.record?.events || {});
          setMeds(json.record?.meds || {checks:{},log:[]});
          setStatus("ok");
        } catch { setStatus("error"); }
      }, []);

      useEffect(() => { fetchEvents(); }, [fetchEvents]);

      useEffect(() => {
        async function silentRefresh() {
          try {
            const r    = await fetch(`${BIN_URL}/latest`, {headers:{"X-Master-Key":API_KEY}});
            const json = await r.json();
            if (json.record?.events) {
              setEvents(json.record.events);
            }
            if (json.record?.meds) {
              setMeds(json.record.meds);
            }
          } catch {}
        }
        const interval = setInterval(silentRefresh, 30 * 60 * 1000);
        function onVisible() {
          if (document.visibilityState === "visible") silentRefresh();
        }
        document.addEventListener("visibilitychange", onVisible);
        return () => {
          clearInterval(interval);
          document.removeEventListener("visibilitychange", onVisible);
        };
      }, []);

      // Scroll to today after load
      useEffect(() => {
        if (status==="ok" && todayRef.current) {
          setTimeout(() => todayRef.current?.scrollIntoView({behavior:"smooth", block:"start"}), 100);
        }
      }, [status]);

      // Lee la última versión guardada para no pisar lo que haya marcado otra persona
      async function fetchRecord() {
        const r    = await fetch(`${BIN_URL}/latest`, {headers:{"X-Master-Key":API_KEY}});
        const json = await r.json();
        if (!json.record) throw new Error("sin datos");
        return json.record;
      }

      async function putRecord(record) {
        const r = await fetch(BIN_URL, {
          method:"PUT",
          headers:{"Content-Type":"application/json","X-Master-Key":API_KEY},
          body: JSON.stringify(record)
        });
        if (!r.ok) throw new Error("no guardado");
      }

      async function saveEvents(ne) {
        setEvents(ne);
        setSaving(true);
        try {
          let rec;
          try { rec = await fetchRecord(); } catch { rec = {meds}; }
          await putRecord({...rec, events:ne});
          setSaveError(false);
        } catch { setSaveError(true); }
        setSaving(false);
      }

      async function updateMeds(mutate) {
        const clone = o => JSON.parse(JSON.stringify(o || {checks:{},log:[]}));
        setMeds(m => mutate(clone(m)));
        setSaving(true);
        try {
          const rec   = await fetchRecord();
          const fresh = mutate(clone(rec.meds));
          await putRecord({...rec, meds:fresh});
          setMeds(fresh);
          if (rec.events) setEvents(rec.events);
          setSaveError(false);
        } catch {
          setSaveError(true);
          alert("⚠️ No se ha podido guardar. Revisa la conexión e inténtalo otra vez.");
        }
        setSaving(false);
      }

      function changeTab(t) {
        setTab(t);
        try { history.replaceState(null, "", t==="meds" ? "#medicacion" : location.pathname + location.search); } catch {}
        window.scrollTo(0,0);
      }

      function openAdd(key)        { setEditKey(key); setEditIdx(null); setForm({time:"12:00",text:"",category:"medico"}); }
      function openEdit(key,eIdx)  { const e=events[key][eIdx]; setEditKey(key); setEditIdx(eIdx); setForm({time:e.time,text:e.text,category:e.category}); }
      function closeModal()        { setEditKey(null); setEditIdx(null); }

      function handleSave() {
        if (!form.text.trim()) return;
        const ne={...events};
        const de=[...(ne[editKey]||[])];
        if (editIdx!==null) de[editIdx]={...form};
        else de.push({...form});
        de.sort((a,b)=>(a.time||"").localeCompare(b.time||""));
        ne[editKey]=de;
        saveEvents(ne); closeModal();
      }

      function handleDelete() {
        const ne={...events};
        const de=[...(ne[editKey]||[])];
        de.splice(editIdx,1);
        if (de.length===0) delete ne[editKey]; else ne[editKey]=de;
        saveEvents(ne); closeModal();
      }

      function scrollToToday() {
        todayRef.current?.scrollIntoView({behavior:"smooth", block:"start"});
      }

      /* ── LOADING ── */
      if (status==="loading") return (
        <div style={{display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",height:"100vh",gap:16}}>
          <div style={{fontSize:52}}>📅</div>
          <div style={{fontSize:22,color:"#888",fontWeight:700}}>Cargando…</div>
        </div>
      );

      /* ── ERROR ── */
      if (status==="error") return (
        <div style={{display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",height:"100vh",gap:16,padding:24}}>
          <div style={{fontSize:52}}>⚠️</div>
          <div style={{fontSize:20,color:"#C0392B",fontWeight:700,textAlign:"center"}}>No se pudo conectar</div>
          <button onClick={fetchEvents} style={{background:"#6C5CE7",color:"white",border:"none",borderRadius:12,padding:"14px 28px",fontSize:16,fontWeight:700,cursor:"pointer"}}>Reintentar</button>
        </div>
      );

      return (
        <div style={{minHeight:"100vh",background:"#EFEFEF"}}>

          {/* ── HEADER fijo ── */}
          <div style={{position:"sticky",top:0,zIndex:10,background:"#5A4FCC",padding:"10px 14px",boxShadow:"0 3px 12px rgba(0,0,0,0.2)"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <button onClick={scrollToToday} style={{visibility:tab==="cal"?"visible":"hidden",background:"rgba(255,255,255,0.15)",border:"1px solid rgba(255,255,255,0.35)",borderRadius:8,color:"white",fontSize:13,fontWeight:700,padding:"7px 12px",cursor:"pointer",letterSpacing:1}}>
                ⭐ HOY
              </button>
              <div style={{color:"white",fontSize:15,fontWeight:900,letterSpacing:0.5}}>
                MARICARMEN
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {saving && <span style={{color:"rgba(255,255,255,0.7)",fontSize:11,fontWeight:600}}>💾</span>}
                {!saving && saveError && <span title="No se pudo guardar" style={{fontSize:13}}>⚠️</span>}
                <button onClick={()=>setMode(m=>m==="view"?"edit":"view")} style={{visibility:tab==="cal"?"visible":"hidden",background:"rgba(255,255,255,0.15)",border:"2px solid rgba(255,255,255,0.45)",borderRadius:10,color:"white",fontSize:13,fontWeight:700,padding:"7px 12px",cursor:"pointer"}}>
                  {isView?"✏️ EDITAR":"👁️ VER"}
                </button>
              </div>
            </div>
            <div style={{display:"flex",gap:6,marginTop:8}}>
              {[["cal","📅 CALENDARIO"],["meds","💊 MEDICACIÓN"]].map(([t,l])=>(
                <button key={t} onClick={()=>changeTab(t)} style={{flex:1,background:tab===t?"white":"rgba(255,255,255,0.12)",color:tab===t?"#5A4FCC":"white",border:"none",borderRadius:8,padding:"8px 0",fontSize:13,fontWeight:800,letterSpacing:1,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
          </div>

          {tab==="meds" && <MedsView meds={meds} updateMeds={updateMeds}/>}

          {tab==="cal" && (<>
          {/* ── DAYS SCROLL ── */}
          {!isView && (
            <div style={{display:"flex",justifyContent:"flex-end",padding:"4px 10px 0"}}>
              <button onClick={()=>setShowPast(p=>!p)} style={{
                background: showPast ? "#6C5CE7" : "white",
                border:"1.5px solid #6C5CE7", borderRadius:8,
                padding:"6px 14px", fontSize:13, fontWeight:700,
                cursor:"pointer", color: showPast ? "white" : "#6C5CE7"
              }}>
                {showPast ? "▲ Ocultar pasado" : "▼ Ver pasado"}
              </button>
            </div>
          )}
          <div style={{padding:"10px 10px 40px",display:"flex",flexDirection:"column",gap:0}}>
            {/* Días pasados — solo en edición con showPast activo */}
            {(!isView && showPast) && (() => {
              const pastDays = Array.from({length:60}, (_,i) => {
                const t = new Date(); t.setHours(0,0,0,0);
                const d = new Date(t);
                d.setDate(t.getDate() - 60 + i);
                return d;
              });
              return pastDays.map((date,idx) => {
                const key     = toKey(date);
                const dow     = date.getDay();
                const dayName = DAY_NAMES[dow];
                const dayEvts = events[key] || [];
                const showMonth = date.getDate()===1 || idx===0;
                return (
                  <div key={"past-"+key}>
                    {showMonth && (
                      <div style={{padding:"18px 4px 8px",fontSize:13,fontWeight:900,color:"#bbb",letterSpacing:3,textTransform:"uppercase",borderBottom:"2px solid #DCDCDC",marginBottom:10,marginTop:idx===0?0:16}}>
                        {MONTH_NAMES[date.getMonth()]} {date.getFullYear()}
                      </div>
                    )}
                    <div style={{background:"#F5F5F5",border:"1px solid #D0D0D0",borderRadius:20,overflow:"hidden",marginBottom:12,opacity:0.75}}>
                      <div style={{background:"#CCCCCC",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                        <div style={{display:"flex",alignItems:"center",gap:10}}>
                          <div style={{fontWeight:800,fontSize:15,color:"#666"}}>
                            {dayName.charAt(0)+dayName.slice(1).toLowerCase()} {date.getDate()}
                          </div>
                        </div>
                        <button onClick={()=>openAdd(key)} style={{background:"#888",color:"white",border:"none",borderRadius:8,padding:"5px 12px",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                          + Añadir
                        </button>
                      </div>
                      {dayEvts.length>0 && (
                        <div style={{padding:"6px 10px",display:"flex",flexDirection:"column",gap:5}}>
                          {dayEvts.map((evt,eIdx) => {
                            const cat=CATEGORIES[evt.category]||CATEGORIES.otro;
                            return (
                              <div key={eIdx} onClick={()=>openEdit(key,eIdx)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:cat.bg,border:`1px solid ${cat.border}`,borderLeft:`4px solid ${cat.border}`,borderRadius:8,cursor:"pointer"}}>
                                <span style={{fontSize:20}}>{cat.emoji}</span>
                                <div style={{flex:1,minWidth:0}}>
                                  <div style={{fontSize:14,fontWeight:700,color:"#222",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{evt.text}</div>
                                  {evt.time && <div style={{fontSize:12,color:cat.color,fontWeight:600}}>🕐 {evt.time}</div>}
                                </div>
                                <div style={{fontSize:12,color:cat.color,fontWeight:700,background:"white",border:`1px solid ${cat.border}`,borderRadius:6,padding:"2px 8px",whiteSpace:"nowrap"}}>{cat.label}</div>
                                <div style={{color:"#CCC",fontSize:16}}>›</div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>
                );
              });
            })()}
            {days.map((date,idx) => {
              const key      = toKey(date);
              const isToday  = isSameDay(date, today);
              const dow      = date.getDay(); // 0=Sun
              const dayName  = DAY_NAMES[dow];
              const dayEvts  = events[key] || [];
              const isFirst  = idx === 0;
              // Month separator: show when day=1 or first in list
              const showMonth = date.getDate()===1 || isFirst;

              return (
                <div key={key}>
                  {/* Month separator */}
                  {showMonth && (
                    <div style={{
                      padding:"18px 4px 8px",
                      fontSize:13, fontWeight:900, color:"#999",
                      letterSpacing:3, textTransform:"uppercase",
                      borderBottom:"2px solid #DCDCDC",
                      marginBottom:10,
                      marginTop: isFirst ? 0 : 16
                    }}>
                      {MONTH_NAMES[date.getMonth()]} {date.getFullYear()}
                    </div>
                  )}

                  {/* Day card */}
                  <div
                    ref={isToday ? todayRef : null}
                    className="today-anchor"
                    style={{
                      background: isToday ? "#EDE9FF" : DAY_TINTS[dow],
                      border: isToday ? "4px solid #6C5CE7" : "2px solid #D8D8D8",
                      borderRadius:20,
                      overflow:"hidden",
                      marginBottom:12,
                      boxShadow: isToday ? "0 6px 28px rgba(108,92,231,0.22)" : "0 2px 8px rgba(0,0,0,0.05)",
                    }}
                  >
                    {/* Day header */}
                    <div style={{
                      background: isToday ? "#6C5CE7" : "#DCDCDC",
                      padding: isView ? "13px 18px" : "10px 14px",
                      display:"flex", alignItems:"center",
                      justifyContent:"space-between"
                    }}>
                      <div style={{display:"flex",alignItems:"center",gap:14}}>
                        {isView ? (
                          <>
                            <div style={{background:isToday?"rgba(255,255,255,0.22)":"white",borderRadius:14,width:74,height:74,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 2px 6px rgba(0,0,0,0.1)",flexShrink:0}}>
                              <div style={{fontSize:44,fontWeight:900,color:isToday?"white":"#333",lineHeight:1}}>{date.getDate()}</div>
                            </div>
                            <div>
                              <div style={{fontSize:32,fontWeight:900,color:isToday?"white":"#333",letterSpacing:1}}>{dayName}</div>
                              {isToday && <div style={{fontSize:15,color:"rgba(255,255,255,0.9)",fontWeight:800,marginTop:3,letterSpacing:3}}>⭐ HOY</div>}
                            </div>
                          </>
                        ) : (
                          <div style={{display:"flex",alignItems:"center",gap:10}}>
                            <div style={{fontWeight:800,fontSize:15,color:isToday?"#6C5CE7":"#444"}}>
                              {dayName.charAt(0)+dayName.slice(1).toLowerCase()} {date.getDate()}
                            </div>
                            {isToday && <span style={{fontSize:11,background:"#6C5CE7",color:"white",borderRadius:6,padding:"2px 7px",fontWeight:700,letterSpacing:1}}>HOY</span>}
                          </div>
                        )}
                      </div>

                      {/* Add button in edit mode */}
                      {!isView && (
                        <button onClick={()=>openAdd(key)} style={{background:"#6C5CE7",color:"white",border:"none",borderRadius:8,padding:"5px 12px",fontSize:13,fontWeight:700,cursor:"pointer",flexShrink:0}}>
                          + Añadir
                        </button>
                      )}
                    </div>

                    {/* Events */}
                    <div style={{padding: dayEvts.length>0 ? "10px 10px" : "0", display:"flex",flexDirection:"column",gap:isView?10:6}}>
                      {isView && dayEvts.length===0 && (
                        <div style={{color:"#CCCCCC",fontSize:20,padding:"10px 10px",fontStyle:"italic",fontWeight:600}}>DÍA LIBRE 🌤️</div>
                      )}
                      {dayEvts.map((evt,eIdx) => {
                        const cat = CATEGORIES[evt.category]||CATEGORIES.otro;
                        return isView ? (
                          <div key={eIdx} style={{background:cat.bg,border:`3px solid ${cat.border}`,borderLeft:`8px solid ${cat.border}`,borderRadius:16,padding:"16px 18px",display:"flex",alignItems:"center",gap:16}}>
                            <div style={{fontSize:60,lineHeight:1,minWidth:68,textAlign:"center",flexShrink:0}}>{cat.emoji}</div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:28,fontWeight:900,color:"#111",lineHeight:1.2,textTransform:"uppercase"}}>{evt.text}</div>
                              {evt.time && <div style={{fontSize:26,color:cat.color,fontWeight:800,marginTop:6}}>🕐 {evt.time}</div>}
                              <div style={{display:"inline-block",marginTop:8,background:cat.border,borderRadius:7,padding:"4px 12px",fontSize:14,fontWeight:900,color:"white",letterSpacing:2,textTransform:"uppercase"}}>{cat.label}</div>
                            </div>
                          </div>
                        ) : (
                          <div key={eIdx} onClick={()=>openEdit(key,eIdx)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",background:cat.bg,border:`1px solid ${cat.border}`,borderLeft:`4px solid ${cat.border}`,borderRadius:8,cursor:"pointer",margin:"0 4px"}}>
                            <span style={{fontSize:20}}>{cat.emoji}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontSize:14,fontWeight:700,color:"#222",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{evt.text}</div>
                              {evt.time && <div style={{fontSize:12,color:cat.color,fontWeight:600}}>🕐 {evt.time}</div>}
                            </div>
                            <div style={{fontSize:12,color:cat.color,fontWeight:700,background:"white",border:`1px solid ${cat.border}`,borderRadius:6,padding:"2px 8px",whiteSpace:"nowrap"}}>{cat.label}</div>
                            <div style={{color:"#CCC",fontSize:16}}>›</div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
          </>)}

          {/* ── MODAL ── */}
          {editKey!==null && (
            <div onClick={e=>e.target===e.currentTarget&&closeModal()} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200,padding:"20px"}}>
              <div style={{background:"white",borderRadius:16,padding:"24px 22px 28px",width:"100%",maxWidth:420,boxShadow:"0 8px 32px rgba(0,0,0,0.18)",maxHeight:"90vh",overflowY:"auto"}}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
                  <div style={{fontSize:16,fontWeight:700,color:"#222"}}>
                    {editIdx!==null?"Editar evento":"Añadir evento"} — {editKey}
                  </div>
                  <button onClick={closeModal} style={{background:"#F0F0F0",border:"none",borderRadius:"50%",width:34,height:34,fontSize:18,cursor:"pointer",color:"#666",display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                </div>

                {/* Tipo */}
                <div style={{marginBottom:18}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:8}}>Tipo</label>
                  <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                    {Object.entries(CATEGORIES).map(([k,cat])=>(
                      <button key={k} onClick={()=>setForm(f=>({...f,category:k}))} style={{background:form.category===k?cat.border:"white",border:`2px solid ${form.category===k?cat.border:"#DEDEDE"}`,borderRadius:20,padding:"7px 14px",fontSize:14,fontWeight:700,cursor:"pointer",color:form.category===k?"white":"#888",display:"flex",alignItems:"center",gap:6}}>
                        <span style={{fontSize:18}}>{cat.emoji}</span>
                        {cat.label.charAt(0)+cat.label.slice(1).toLowerCase()}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Hora */}
                <div style={{marginBottom:14}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>Hora (opcional)</label>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <select value={form.time?form.time.split(":")[0]:"12"} onChange={e=>{const m=form.time?form.time.split(":")[1]:"00";setForm(f=>({...f,time:`${e.target.value}:${m}`}));}} style={{flex:1,padding:"10px 8px",fontSize:18,borderRadius:10,border:"1.5px solid #DEDEDE",outline:"none",fontWeight:700,color:"#333",background:"white"}}>
                      {Array.from({length:24},(_,i)=>String(i).padStart(2,"0")).map(h=><option key={h} value={h}>{h}</option>)}
                    </select>
                    <span style={{fontSize:22,fontWeight:800,color:"#888"}}>:</span>
                    <select value={form.time?form.time.split(":")[1]:"00"} onChange={e=>{const h=form.time?form.time.split(":")[0]:"12";setForm(f=>({...f,time:`${h}:${e.target.value}`}));}} style={{flex:1,padding:"10px 8px",fontSize:18,borderRadius:10,border:"1.5px solid #DEDEDE",outline:"none",fontWeight:700,color:"#333",background:"white"}}>
                      {["00","15","30","45"].map(m=><option key={m} value={m}>{m}</option>)}
                    </select>
                  </div>
                </div>

                {/* Texto */}
                <div style={{marginBottom:22}}>
                  <label style={{fontSize:12,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:1,display:"block",marginBottom:6}}>¿Qué hay?</label>
                  <input type="text" value={form.text} onChange={e=>setForm(f=>({...f,text:e.target.value}))} placeholder="Ej: Revisión con el médico" style={{width:"100%",padding:"10px 14px",fontSize:16,borderRadius:10,border:"1.5px solid #DEDEDE",outline:"none",boxSizing:"border-box",fontWeight:600,color:"#333"}}/>
                </div>

                {/* Botones */}
                <div style={{display:"flex",gap:10}}>
                  {editIdx!==null && (
                    <button onClick={handleDelete} style={{flex:1,padding:"11px",borderRadius:10,border:"1.5px solid #E74C3C",background:"#FFF5F5",color:"#C0392B",fontSize:14,fontWeight:700,cursor:"pointer"}}>🗑️ Borrar</button>
                  )}
                  <button onClick={handleSave} style={{flex:2,padding:"11px",borderRadius:10,border:"none",background:"#6C5CE7",color:"white",fontSize:15,fontWeight:700,cursor:"pointer",boxShadow:"0 3px 10px rgba(108,92,231,0.3)"}}>
                    {editIdx!==null?"Guardar cambios":"✓ Añadir"}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
  </script>
</body>
</html>
